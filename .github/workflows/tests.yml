name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff bandit pytest numpy onnx onnxruntime
      - run: ruff check .
      - run: bandit -q -r landsat_sr scripts
      - run: python -m pytest -q   # GDAL and QGIS tests skip here and run in the next job
      - run: python scripts/package_plugin.py
      - run: python scripts/validate_plugin.py landsat_sr --zip dist/landsat_sr.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy onnx onnxruntime
      - run: python -m pytest -q
  qgis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ['release-3_34', 'ltr', 'latest']
    container:
      image: qgis/qgis:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages pytest || python3 -m pip install pytest
      - run: QT_QPA_PLATFORM=offscreen python3 -m pytest -q -rs
